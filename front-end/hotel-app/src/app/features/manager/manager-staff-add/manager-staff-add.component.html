<div class="container">
  <h2>Add Receptionist</h2>
  <form (ngSubmit)="save()" #staffForm="ngForm">
    <div class="form-group">
      <label for="name">Name *</label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        [(ngModel)]="staff.name" 
        required 
        class="form-control"
        placeholder="Enter full name">
    </div>

    <div class="form-group">
      <label for="email">Email *</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="staff.email" 
        required 
        class="form-control"
        placeholder="Enter email address">
      <div *ngIf="emailError" class="alert alert-danger" style="margin-top:6px;">{{emailError}}</div>
    </div>

    <div class="form-group">
      <label for="phone">Phone *</label>
      <input 
        type="tel" 
        id="phone" 
        name="phone" maxlength="10"
        [(ngModel)]="staff.phone" 
        required 
        class="form-control"
        placeholder="Enter phone number">
      <div *ngIf="phoneError" class="alert alert-danger" style="margin-top:6px;">{{phoneError}}</div>
    </div>

    <div class="form-group">
      <label>Hotel</label>
      <input 
        type="text" 
        [value]="hotelName" 
        readonly 
        class="form-control readonly">
      <small class="form-text">This receptionist will be assigned to your hotel</small>
    </div>

    <div *ngIf="formError" class="alert alert-danger">{{formError}}</div>

    <div class="form-actions">
      <button type="button" (click)="cancel()" class="btn btn-secondary" [disabled]="loading">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{loading ? 'Creating...' : 'Create Receptionist'}}
      </button>
    </div>
  </form>
</div>
