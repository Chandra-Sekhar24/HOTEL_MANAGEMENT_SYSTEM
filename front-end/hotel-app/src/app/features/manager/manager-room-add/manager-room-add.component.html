<div class="container">
  <h2>Add Room</h2>
  <form (ngSubmit)="save()" #roomForm="ngForm">
    <div class="form-group">
      <label for="roomNumber">Room Number *</label>
      <input 
        type="text" 
        id="roomNumber" 
        name="roomNumber" 
        [(ngModel)]="room.roomNumber" 
        required 
        class="form-control"
        placeholder="Enter room number">
    </div>

    <div class="form-group">
      <label for="roomTypeId">Room Type *</label>
      <select 
        id="roomTypeId" 
        name="roomTypeId" 
        [(ngModel)]="room.roomTypeId" 
        required 
        class="form-control">
        <option value="">Select room type</option>
        <option *ngFor="let rt of roomTypes" [value]="rt.id">{{rt.name}} - ${{rt.basePrice}}/night</option>
      </select>
      <div *ngIf="roomTypesLoading" class="loading">Loading room types...</div>
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select 
        id="status" 
        name="status" 
        [(ngModel)]="room.status" 
        class="form-control">
        <option *ngFor="let option of statusOptions" [value]="option.value">{{option.label}}</option>
      </select>
    </div>

    <div *ngIf="formError" class="alert alert-danger">{{formError}}</div>

    <div class="form-actions">
      <button type="button" (click)="cancel()" class="btn btn-secondary" [disabled]="loading">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="loading || roomTypesLoading">
        {{loading ? 'Creating...' : 'Create Room'}}
      </button>
    </div>
  </form>
</div>
